name: Android Build

on:
  push:
    branches: ["master"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.1

      - name: Setup Java JDK
        uses: actions/setup-java@v4.0.0
        with:
          java-version: '17'
          distribution: 'adopt'

      - name: Change wrapper permissions
        run: chmod +x ./gradlew

      - name: Generate app version
        id: version-autopilot
        uses: leblancmeneses/actions/apps/version-autopilot@v6.0.1
        with:
          major: 1
          minor: 0
          shift: 0

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
        env:
          APP_VERSION_CODE: ${{ steps.version-autopilot.outputs.version_autopilot_code }}
          APP_VERSION_STRING: ${{ steps.version-autopilot.outputs.version_autopilot_string_recommended }}

      - name: Upload artifact to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1.7.1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          groups: Testers
          file: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AndroidCICD.apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
